name: Build OmniRoute from source and publish to GHCR

# Mirror of upstream diegosouzapw/OmniRoute .github/workflows/docker-publish.yml,
# adapted to build the upstream DEFAULT BRANCH from this repo and publish to
# GHCR only (no Docker Hub). Tracks the upstream default branch (release/v*)
# on a schedule, publishing the floating `latest` channel.

on:
  # The upstream repo does not push to this repo, so poll its default branch
  # daily and rebuild the floating `latest` channel.
  schedule:
    - cron: "37 4 * * *"
  # Rebuild when this workflow itself changes.
  push:
    paths:
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream branch/tag to build (empty = default branch; tags v* publish an immutable version)"
        required: false
        type: string
        default: ""
      promote_latest:
        description: "Also tag :latest (only for immutable version builds)"
        required: false
        type: boolean
        default: false

# Least-privilege default: read-only at the top level; the build and merge jobs that
# push to GHCR grant packages: write themselves (Scorecard TokenPermissions).
permissions:
  contents: read

env:
  UPSTREAM_REPO: diegosouzapw/OmniRoute

jobs:
  prepare:
    name: Resolve Docker release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      promote_latest: ${{ steps.version.outputs.promote_latest }}
      skip: ${{ steps.version.outputs.skip }}
      ref: ${{ steps.version.outputs.ref }}
    env:
      GHCR_IMAGE_NAME: ghcr.io/thefrenchghosty/omniroute
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ inputs.ref || '' }}
          # Need full tag history for semver comparison when deciding :latest.
          fetch-depth: 0

      - name: Resolve version, latest-promotion, and skip flag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          PROMOTE_INPUT: ${{ inputs.promote_latest }}
        run: |
          set -euo pipefail

          # 1) Resolve version/channel from the trigger. Building the upstream
          # DEFAULT branch publishes the mutable `latest` channel.
          VERSION="latest"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_REF" ]; then
            case "$INPUT_REF" in
              refs/tags/v*) VERSION="${INPUT_REF#refs/tags/v}" ;;
              v[0-9]*)      VERSION="${INPUT_REF#v}" ;;
              *)            VERSION="latest" ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=${INPUT_REF:-}" >> "$GITHUB_OUTPUT"

          # 2) Decide whether to promote :latest. The floating `latest` build
          # already IS :latest (no separate promotion), and pre-release
          # identifiers are excluded.
          PROMOTE="false"
          if [ "$VERSION" = "latest" ]; then
            PROMOTE="false"
          elif printf '%s' "$VERSION" | grep -qE -- '-(rc|alpha|beta|pre|next)'; then
            echo "Pre-release identifier detected - skipping :latest."
            PROMOTE="false"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROMOTE="${PROMOTE_INPUT:-false}"
          fi
          echo "promote_latest=$PROMOTE" >> "$GITHUB_OUTPUT"

          # 3) Skip immutable version tags that already exist. The floating
          # `latest` channel is intentionally rebuilt on every run.
          SKIP="false"
          if [ "$VERSION" != "latest" ]; then
            if docker manifest inspect "${GHCR_IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
              echo "Image ${GHCR_IMAGE_NAME}:${VERSION} already exists on GHCR - skipping rebuild."
              SKIP="true"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

          echo "Publishing ${GHCR_IMAGE_NAME}:$VERSION (promote_latest=$PROMOTE, skip=$SKIP)"

  build:
    name: Build Docker (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      GHCR_IMAGE_NAME: ghcr.io/thefrenchghosty/omniroute
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Build and push WEB platform image by digest
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-web
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}
          cache-from: type=gha,scope=docker-web-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-web-${{ matrix.arch }},mode=max
          no-cache: false
        env:
          DOCKER_BUILDKIT_INLINE_CACHE: 1

      - name: Export digests
        env:
          DIGEST_BASE: ${{ steps.build.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests/base /tmp/digests/web
          touch "/tmp/digests/base/${DIGEST_BASE#sha256:}"
          touch "/tmp/digests/web/${DIGEST_WEB#sha256:}"

      - name: Upload base digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-base-${{ matrix.arch }}
          path: /tmp/digests/base/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload web digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-web-${{ matrix.arch }}
          path: /tmp/digests/web/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifests
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      GHCR_IMAGE_NAME: ghcr.io/thefrenchghosty/omniroute
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download base digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-base-*
          path: /tmp/digests/base
          merge-multiple: true

      - name: Download web digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-web-*
          path: /tmp/digests/web
          merge-multiple: true

      - name: Create GHCR manifest
        run: |
          set -euo pipefail

          create_manifest() {
            local image="$1" suffix="$2" dir="$3"
            local tags=(-t "${image}:${VERSION}${suffix}")
            if [ "$PROMOTE_LATEST" = "true" ]; then
              tags+=(-t "${image}:latest${suffix}")
            fi
            local refs=()
            while IFS= read -r digest_file; do
              refs+=("${image}@sha256:$(basename "$digest_file")")
            done < <(find "$dir" -type f | sort)
            if [ "${#refs[@]}" -eq 0 ]; then
              echo "No image digests in $dir" >&2
              exit 1
            fi
            docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          }

          create_manifest "${GHCR_IMAGE_NAME}" "" /tmp/digests/base
          create_manifest "${GHCR_IMAGE_NAME}" "-web" /tmp/digests/web

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE_NAME}:${VERSION}"

      - name: Generate CycloneDX SBOM (image, advisory)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image.cdx.json

      # Visibility scan: reports HIGH + CRITICAL into the SARIF (Security tab) but
      # never blocks (exit-code 0). The blocking gate below narrows to CRITICAL.
      # Mirrors upstream; trivyignores points at the upstream repo-root .trivyignore.
      - name: Trivy image scan (SARIF, advisory)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "0"

      # BLOCKING gate, same as upstream: fail on a fixable CRITICAL CVE in the
      # published image. Runs after the manifests are published, so the image is
      # available on GHCR even if this gate reds the run.
      - name: Trivy CRITICAL gate (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE_NAME }}:${{ env.VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF to Security tab
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
